<details><summary>Speaker notes</summary><p>Welcome the audience and say what this presentation covers: the three products we will build first, what each one is, what could stop us, and what it costs in money and people. Everything here comes from the product list in our strategy toolkit, so the scores and costs match that file.</p></details>

<details><summary>Speaker notes</summary><p>Our strategy toolkit scores every product as impact minus effort. That score favours cheap wins, so we ranked our top three by a different test: what the model cannot work without. First the training course, because without skills there is nobody to employ. Second the project platform, because it turns those skills into paid, permitted work. Third the charity-ticket hackathon page, because it funds the first two and brings in volunteer teachers. Several products score higher, such as the sponsorship pack, the gift catalogue and the diaspora business studio, and they come next.</p></details>

<details><summary>Speaker notes</summary><p>The three products in order of importance, then the loop at the bottom. Ticket buyers and donors pay for the training. Trainees complete the 12-week course. Jiwar employs them with work permits and assigns them paid projects from local businesses. Finished projects become stories and proof, which bring more support. Each product drives one part of that loop.</p></details>

<details><summary>Speaker notes</summary><p>We want to host the course ourselves, so we compared four options. Google Classroom is what we use now, but it is not in-house and does not connect to permits or payments. Moodle is open source, supports Arabic with right-to-left layout and handles quizzes and certificates, so it is our recommendation. Kolibri is an offline-first open source platform from Learning Equality that has been used in refugee camps. It runs on a laptop and serves nearby devices without internet, so it suits camp centres with weak connections. A learning module inside our own platform is the best long-term link to permits and projects, but it would delay the first version, so it comes later.</p></details>

<script>
(function(){
  var BASE_W=1920, BASE_H=1080;
  var frames=[].slice.call(document.querySelectorAll('.frame'));
  var slides=frames.map(function(f){return f.querySelector('.slide');});
  function fit(){frames.forEach(function(f){f.style.setProperty('--s',(f.clientWidth/BASE_W).toFixed(5));});}
  if(window.ResizeObserver){new ResizeObserver(fit).observe(document.getElementById('deck'));}
  window.addEventListener('resize',fit); fit();

  /* ---------- present mode ---------- */
  var present=document.getElementById('present'), stage=document.getElementById('stage'), hud=document.getElementById('hud');
  var countEl=document.getElementById('count'), cur=0, layer=null, busy=false, idleTimer=null, lastFocus=null;
  function scalePresent(){var r=present.getBoundingClientRect();present.style.setProperty('--ps',Math.min(r.width/BASE_W,r.height/BASE_H).toFixed(5));}
  function makeLayer(i){var d=document.createElement('div');d.className='layer';d.appendChild(slides[i].cloneNode(true));return d;}
  function show(i,dir){
    if(i<0||i>=slides.length||(layer&&i===cur)) return;
    var next=makeLayer(i);
    if(layer&&dir){
      var old=layer; old.className='layer out-'+dir; next.className='layer in-'+dir;
      old.addEventListener('animationend',function(){old.remove();},{once:true});
      setTimeout(function(){if(old.parentNode) old.remove();},900);
    } else if(layer){layer.remove();}
    stage.appendChild(next); layer=next; cur=i;
    countEl.textContent=(i+1)+' / '+slides.length;
  }
  function wake(){hud.classList.remove('idle');clearTimeout(idleTimer);idleTimer=setTimeout(function(){hud.classList.add('idle');},2500);}
  function openPresent(i){
    lastFocus=document.activeElement; present.hidden=false; document.body.style.overflow='hidden';
    scalePresent(); layer=null; stage.textContent=''; show(i||0,null); wake();
    try{var p=present.requestFullscreen&&present.requestFullscreen(); if(p&&p.catch)p.catch(function(){});}catch(e){}
    document.getElementById('nextBtn').focus({preventScroll:true});
  }
  function closePresent(){
    if(present.hidden) return;
    present.hidden=true; document.body.style.overflow='';
    if(document.fullscreenElement&&document.exitFullscreen){document.exitFullscreen().catch(function(){});}
    var target=document.getElementById('slide-'+(cur+1)); if(target) target.scrollIntoView({block:'start'});
    if(lastFocus&&lastFocus.focus) lastFocus.focus({preventScroll:true});
  }
  function next(){show(cur+1,'next');} function prev(){show(cur-1,'prev');}
  document.getElementById('presentBtn').addEventListener('click',function(){openPresent(0);});
  [].forEach.call(document.querySelectorAll('.from-here'),function(b){b.addEventListener('click',function(){openPresent(+b.dataset.i);});});
  document.getElementById('nextBtn').addEventListener('click',function(e){e.stopPropagation();next();wake();});
  document.getElementById('prevBtn').addEventListener('click',function(e){e.stopPropagation();prev();wake();});
  document.getElementById('exitBtn').addEventListener('click',function(e){e.stopPropagation();closePresent();});
  stage.addEventListener('click',function(e){var r=stage.getBoundingClientRect(); (e.clientX-r.left<r.width/3)?prev():next(); wake();});
  present.addEventListener('mousemove',wake);
  var tx=null; present.addEventListener('touchstart',function(e){tx=e.touches[0].clientX;wake();},{passive:true});
  present.addEventListener('touchend',function(e){if(tx===null)return;var dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>40){dx<0?next():prev();}tx=null;});
  document.addEventListener('keydown',function(e){
    if(present.hidden) return;
    var k=e.key;
    if(k==='ArrowRight'||k==='PageDown'||k===' '||k==='Enter'){e.preventDefault();next();}
    else if(k==='ArrowLeft'||k==='PageUp'||k==='Backspace'){e.preventDefault();prev();}
    else if(k==='Home'){e.preventDefault();show(0,'prev');}
    else if(k==='End'){e.preventDefault();show(slides.length-1,'next');}
    else if(k==='Escape'){e.preventDefault();closePresent();}
    wake();
  });
  document.addEventListener('fullscreenchange',function(){scalePresent();});
  window.addEventListener('resize',function(){if(!present.hidden) scalePresent();});

  /* ---------- PDF download ---------- */
  var pdfBtn=document.getElementById('pdfBtn'), status=document.getElementById('status'), downloads=null;
  function say(t){status.textContent=t;}
  (async function(){
    try{ if(window.claude&&typeof window.claude.use==='function'){ downloads=await window.claude.use('downloads'); } }catch(e){downloads=null;}
    if(downloads){ pdfBtn.disabled=false; }
    else { pdfBtn.hidden=true; }
  })();
  pdfBtn.addEventListener('click',async function(){
    if(!downloads) return;
    pdfBtn.disabled=true; say('Preparing the PDF…');
    try{
      var b64=document.getElementById('pdf-data').textContent.trim();
      var bin=atob(b64), bytes=new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
      var res=await downloads.save({filename:'Jiwar_Top_3_Products.pdf',data:new Blob([bytes])});
      say(res&&res.status==='delivered'?'PDF sent.':'PDF downloaded.');
    }catch(err){
      var c=err&&err.code;
      if(c==='declined') say('Download cancelled.');
      else if(c==='rate_limited') say('A save prompt is already open. Finish it, then try again.');
      else if(c==='unavailable'||c==='not_granted'||c==='capability_disabled'||c==='capability_removed'){ say('Downloading isn\u2019t available in this view.'); pdfBtn.hidden=true; }
      else say('The PDF could not be downloaded. Try again.');
    }finally{ if(!pdfBtn.hidden) pdfBtn.disabled=false; }
  });
})();
</script>
</body></html>
